<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI 学习助手 — 能看·会听·会说</title>
<style>
:root {
  --bg-0: #000; --bg-1: #0a0a0a; --bg-2: #141414; --bg-3: #1a1a1a; --bg-4: #222;
  --text-1: #ededed; --text-2: #a1a1a1; --text-3: #888;
  --accent: #0070f3; --accent-green: #00b878; --accent-red: #e00; --accent-purple: #7928ca;
  --radius: 10px; --radius-sm: 6px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', 'SF Mono', 'Fira Code', monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg-0);color:var(--text-1);height:100vh;overflow:hidden}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:var(--font);background:var(--bg-2);border:1px solid rgba(255,255,255,.08);color:var(--text-1);border-radius:var(--radius-sm);padding:10px 14px;outline:none;font-size:14px;width:100%}
textarea{resize:none;min-height:44px;max-height:120px;line-height:1.5}
textarea:focus, input:focus{border-color:var(--accent)}

/* Layout */
.app{max-width:720px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
.header{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;flex-shrink:0}
.header .logo{font-size:16px;font-weight:600;letter-spacing:-.3px}
.header .badge{font-size:10px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;opacity:.85}

/* Chat area */
.chat-area{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.chat-area:empty::after{content:'👋 拍照提问、按住录音、或输入文字';display:block;text-align:center;color:var(--text-3);padding:50px 0;font-size:14px}

/* Message bubbles */
.msg{max-width:90%;padding:12px 16px;border-radius:var(--radius);line-height:1.7;font-size:14px;word-break:break-word;animation:fadeIn .2s}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:2px}
.msg.ai{align-self:flex-start;background:var(--bg-2);border:1px solid rgba(255,255,255,.06);border-bottom-left-radius:2px}
.msg .meta{font-size:10px;color:var(--text-3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.msg.ai .meta{color:var(--accent-purple)}
.msg .content{white-space:pre-wrap}
.msg .content code{font-family:var(--font-mono);background:var(--bg-4);padding:1px 5px;border-radius:3px;font-size:12.5px}
.msg .content strong{color:var(--text-1)}
.msg .streaming{cursor:default}

/* Image in message */
.msg .msg-image{max-width:180px;border-radius:var(--radius-sm);margin-bottom:6px;overflow:hidden}
.msg .msg-image img{width:100%;height:auto;border-radius:var(--radius-sm);display:block}

/* Play button on AI messages */
.btn-play{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;background:var(--bg-3);border:1px solid rgba(255,255,255,.08);color:var(--text-2);border-radius:20px;font-size:12px;cursor:pointer;margin-top:8px;transition:all .15s}
.btn-play:hover{color:var(--text-1);border-color:rgba(255,255,255,.15)}
.btn-play.playing{background:var(--accent-green);color:#fff;border-color:var(--accent-green)}

/* Thinking section in AI bubble */
.thinking-block{font-size:11px;color:var(--text-3);padding:6px 10px;margin-top:8px;background:var(--bg-0);border-radius:var(--radius-sm);border-left:3px solid var(--accent);max-height:100px;overflow-y:auto;line-height:1.5;display:none}
.thinking-block.visible{display:block}

/* Loading indicator */
.loading{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.15);border-top:2px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Input bar */
.bottom-bar{padding:10px 16px 14px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.input-row{display:flex;gap:8px;align-items:flex-end}
.btn-send{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.btn-send:hover{opacity:.85}
.btn-send:disabled{opacity:.4;cursor:not-allowed}

/* Action buttons */
.action-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-action{display:flex;align-items:center;gap:5px;padding:6px 12px;background:var(--bg-2);border:1px solid rgba(255,255,255,.06);color:var(--text-2);border-radius:20px;font-size:12px;cursor:pointer;transition:all .15s}
.btn-action:hover{color:var(--text-1);border-color:rgba(255,255,255,.12)}
.btn-action.recording{background:var(--accent-red);color:#fff;border-color:var(--accent-red)}
.btn-action .icon{font-size:14px;line-height:1}

/* Recording indicator */
.rec-dot{display:none;width:8px;height:8px;border-radius:50%;background:var(--accent-red);margin-right:4px;animation:pulse 1s infinite}
.rec-dot.active{display:inline-block}
.rec-text{display:none;font-size:11px;color:var(--accent-red)}
.rec-text.active{display:inline}

/* Image preview */
.img-chip{display:none;align-items:center;gap:6px;padding:4px 10px;background:var(--bg-3);border-radius:20px;font-size:12px;color:var(--text-2)}
.img-chip.visible{display:flex}
.img-chip .remove{color:var(--accent-red);cursor:pointer;font-weight:700;font-size:14px;line-height:1}

/* Status bar */
.status-bar{font-size:11px;color:var(--text-3);text-align:center;padding:2px 0;display:none;min-height:18px}
.status-bar.visible{display:block}

/* Toast */
.toast-container{position:fixed;top:16px;right:16px;z-index:999;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;max-width:300px;animation:slideIn .3s}
.toast.info{background:rgba(0,112,243,.15);color:var(--accent);border:1px solid rgba(0,112,243,.2)}
.toast.error{background:rgba(224,0,0,.12);color:var(--accent-red);border:1px solid rgba(224,0,0,.2)}
.toast.success{background:rgba(0,184,120,.12);color:var(--accent-green);border:1px solid rgba(0,184,120,.2)}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

.hidden-input{display:none}

@media(max-width:480px){
  .btn-action{font-size:11px;padding:5px 10px}
  .header{padding:12px 14px}
  .chat-area{padding:12px 14px}
  .bottom-bar{padding:8px 12px 12px}
}
</style>
</head>
<body>

<div class="toast-container" id="toasts"></div>

<div class="app">
  <div class="header">
    <span class="logo">🤖 AI 学习助手</span>
    <span class="badge">多模态</span>
    <span style="font-size:10px;color:var(--text-3);margin-left:auto" id="session-tag">新会话</span>
  </div>

  <div class="chat-area" id="chat-area"></div>

  <div class="bottom-bar">
    <div class="status-bar" id="status-bar"></div>
    <div class="input-row">
      <textarea id="text-input" placeholder="输入问题、拍照上传或按住录音..." rows="1"></textarea>
      <button class="btn-send" id="btn-send" onclick="sendMessage()">发送</button>
    </div>
    <div class="action-row">
      <button class="btn-action" onclick="document.getElementById('camera-input').click()">
        <span class="icon">📷</span> 拍照
      </button>
      <label class="btn-action">
        <span class="icon">🖼</span> 上传
        <input type="file" accept="image/*" class="hidden-input" onchange="handleImageUpload(this)">
      </label>
      <button class="btn-action" id="btn-record" onmousedown="startRecording()" onmouseup="stopRecording()" onmouseleave="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()">
        <span class="icon">🎤</span> 录音
      </button>
      <span class="rec-dot" id="rec-dot"></span>
      <span class="rec-text" id="rec-text">录音中...</span>
      <div class="img-chip" id="img-chip">
        📎 <span id="img-name"></span>
        <span class="remove" onclick="clearImage(event)">✕</span>
      </div>
    </div>
  </div>
</div>

<input type="file" accept="image/*" capture="environment" class="hidden-input" id="camera-input" onchange="handleImageUpload(this)">
<audio id="tts-audio" style="display:none"></audio>

<script>
// =========================================================================
// State
// =========================================================================
const API = '/api/v1/multimodal';
let currentSessionId = null;
let currentImageBase64 = null;
let mediaRecorder = null;
let audioChunks = [];
let ttsAudio = document.getElementById('tts-audio');

// =========================================================================
// Toast
// =========================================================================
function toast(msg, type) {
  type = type || 'info';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(function() { el.remove(); }, 3500);
}

// =========================================================================
// Escape HTML
// =========================================================================
function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function md(text) {
  if (!text) return '';
  return esc(text)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

// =========================================================================
// Image handling
// =========================================================================
function handleImageUpload(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    currentImageBase64 = e.target.result;
    document.getElementById('img-chip').classList.add('visible');
    document.getElementById('img-name').textContent = file.name;
    toast('图片已加载，AI 将直接查看图片内容', 'info');
  };
  reader.readAsDataURL(file);
}

function clearImage(e) {
  e.stopPropagation();
  currentImageBase64 = null;
  document.getElementById('img-chip').classList.remove('visible');
  document.getElementById('camera-input').value = '';
}

// =========================================================================
// Voice recording
// =========================================================================
function startRecording() {
  var btn = document.getElementById('btn-record');
  if (btn.classList.contains('recording')) return;
  audioChunks = [];

  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    mediaRecorder.ondataavailable = function(e) { audioChunks.push(e.data); };
    mediaRecorder.onstop = function() {
      stream.getTracks().forEach(function(t) { t.stop(); });
      processRecording();
    };
    mediaRecorder.start();
    btn.classList.add('recording');
    document.getElementById('rec-dot').classList.add('active');
    document.getElementById('rec-text').classList.add('active');
    toast('录音中，松开发送...', 'info');
  }).catch(function(e) {
    toast('无法访问麦克风: ' + e.message, 'error');
  });
}

function stopRecording() {
  var btn = document.getElementById('btn-record');
  if (!btn.classList.contains('recording')) return;
  btn.classList.remove('recording');
  document.getElementById('rec-dot').classList.remove('active');
  document.getElementById('rec-text').classList.remove('active');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
}

function processRecording() {
  if (!audioChunks.length) return;
  var blob = new Blob(audioChunks, { type: 'audio/webm' });
  blobToBase64(blob).then(function(base64) {
    addMessage('user', '🎤 语音输入', null);
    setStatus('正在识别语音...', 'visible');

    var body = {
      audio_base64: base64,
      template: 'basic',
      max_steps: 10,
      session_id: currentSessionId
    };
    if (currentImageBase64) body.image_base64 = currentImageBase64;

    fetch(API + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(res) {
      if (!res.ok) return res.json().then(function(e) { throw new Error(e.detail || '请求失败'); });
      return handleSSEStream(res);
    }).catch(function(e) {
      toast('语音处理失败: ' + e.message, 'error');
      setStatus('', '');
    });
  });
}

function blobToBase64(blob) {
  return new Promise(function(resolve) {
    var reader = new FileReader();
    reader.onload = function() {
      resolve(reader.result.split(',')[1]);
    };
    reader.readAsDataURL(blob);
  });
}

// =========================================================================
// Text send
// =========================================================================
function sendMessage() {
  var input = document.getElementById('text-input');
  var text = input.value.trim();
  if (!text && !currentImageBase64) { toast('请输入问题或上传图片', 'error'); return; }

  var preview = '';
  if (currentImageBase64) {
    preview = '<div class="msg-image"><img src="' + currentImageBase64 + '" alt="uploaded"></div>';
  }
  addMessage('user', text || '📎 查看图片', preview);

  input.value = '';
  input.style.height = 'auto';
  var btn = document.getElementById('btn-send');
  btn.disabled = true;
  btn.textContent = '思考中...';

  var body = {
    template: 'basic',
    max_steps: 10,
    session_id: currentSessionId
  };
  if (text) body.text = text;
  if (currentImageBase64) body.image_base64 = currentImageBase64;

  fetch(API + '/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(res) {
    if (!res.ok) return res.json().then(function(e) { throw new Error(e.detail || '请求失败'); });
    return handleSSEStream(res);
  }).catch(function(e) {
    toast('请求失败: ' + e.message, 'error');
  }).finally(function() {
    btn.disabled = false;
    btn.textContent = '发送';
  });
}

// =========================================================================
// SSE Stream handling
// =========================================================================
function handleSSEStream(response) {
  var reader = response.body.getReader();
  var decoder = new TextDecoder();
  var buffer = '';
  var currentEvent = '';
  var aiBubble = null;
  var answerText = '';
  var thinkingDiv = null;

  setStatus('AI 正在思考...', 'visible');

  function pump() {
    return reader.read().then(function(result) {
      if (result.done) {
        setStatus('', '');
        return;
      }

      buffer += decoder.decode(result.value, { stream: true });
      var lines = buffer.split('\n');
      buffer = lines.pop();

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        if (line.startsWith('event: ')) {
          currentEvent = line.slice(7).trim();
        } else if (line.startsWith('data: ')) {
          var dataStr = line.slice(6);
          try {
            var data = JSON.parse(dataStr);

            if (currentEvent === 'asr_result') {
              setStatus('识别结果: ' + (data.text || ''), 'visible');
            }

            else if (currentEvent === 'thought') {
              if (!aiBubble) {
                aiBubble = addMessage('ai', '', null);
                aiBubble.classList.add('streaming');
                thinkingDiv = aiBubble.querySelector('.thinking-block');
                if (thinkingDiv) thinkingDiv.classList.add('visible');
              }
              if (thinkingDiv) {
                thinkingDiv.textContent += (data.thought || '') + '\n';
                thinkingDiv.scrollTop = thinkingDiv.scrollHeight;
              }
            }

            else if (currentEvent === 'answer') {
              answerText = data.answer || '';
              if (aiBubble) {
                aiBubble.classList.remove('streaming');
                var loadEl = aiBubble.querySelector('.loading-wrap');
                if (loadEl) loadEl.remove();
                aiBubble.querySelector('.content').innerHTML = md(answerText);
                addPlayButton(aiBubble, answerText);
                if (thinkingDiv && !thinkingDiv.textContent.trim()) {
                  thinkingDiv.classList.remove('visible');
                }
              } else {
                aiBubble = addMessage('ai', answerText, null);
                addPlayButton(aiBubble, answerText);
              }
              setStatus('', '');
            }

            else if (currentEvent === 'session') {
              currentSessionId = data.multimodal_session_id;
              document.getElementById('session-tag').textContent = '会话: ' + currentSessionId.slice(0, 8) + '...';
            }

            else if (currentEvent === 'done') {
              if (data.multimodal_session_id) {
                currentSessionId = data.multimodal_session_id;
                document.getElementById('session-tag').textContent = '会话: ' + currentSessionId.slice(0, 8) + '...';
              }
              if (data.hit_max_steps) {
                toast('已达到最大推理步数', 'error');
              }
            }

            else if (currentEvent === 'error' || currentEvent === 'asr_error') {
              toast(data.error || '处理出错', 'error');
              setStatus('', '');
            }
          } catch(e) { /* ignore parse errors */ }
          currentEvent = '';
        }
      }

      return pump();
    });
  }

  return pump();
}

// =========================================================================
// UI helpers
// =========================================================================
function addMessage(role, text, imageHtml) {
  var area = document.getElementById('chat-area');
  var div = document.createElement('div');
  div.className = 'msg ' + role;

  var html = '';
  if (imageHtml) html += imageHtml;
  if (role === 'ai') {
    html += '<div class="meta">🤖 AI 助手</div>';
    html += '<div class="content">' + (text ? md(text) : '<span class="loading"></span> 推理中...') + '</div>';
    html += '<div class="loading-wrap" style="display:none"><span class="loading"></span></div>';
    html += '<div class="thinking-block"></div>';
  } else {
    html += '<div class="meta">👤 你</div>';
    html += '<div class="content">' + esc(text) + '</div>';
  }

  div.innerHTML = html;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function addPlayButton(bubble, text) {
  if (!text || text.length < 3) return;
  var btn = document.createElement('button');
  btn.className = 'btn-play';
  btn.innerHTML = '🔊 播放语音';
  btn.onclick = function() { playTTS(text, btn); };
  bubble.appendChild(btn);
}

function playTTS(text, btn) {
  if (btn.classList.contains('playing')) {
    ttsAudio.pause();
    btn.classList.remove('playing');
    btn.innerHTML = '🔊 播放语音';
    return;
  }

  btn.classList.add('playing');
  btn.innerHTML = '<span class="loading"></span> 合成中...';

  fetch(API + '/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      text: text.slice(0, 2000),
      voice: 'alloy',
      speed: 1.0
    })
  }).then(function(res) {
    if (!res.ok) throw new Error('TTS 失败');
    return res.blob();
  }).then(function(blob) {
    var url = URL.createObjectURL(blob);
    ttsAudio.src = url;
    ttsAudio.onended = function() {
      btn.classList.remove('playing');
      btn.innerHTML = '🔊 播放语音';
      URL.revokeObjectURL(url);
    };
    ttsAudio.onerror = function() {
      toast('语音播放失败', 'error');
      btn.classList.remove('playing');
      btn.innerHTML = '🔊 播放语音';
    };
    ttsAudio.play();
    btn.classList.add('playing');
    btn.innerHTML = '⏸ 播放中...';
  }).catch(function(e) {
    toast('语音合成失败: ' + e.message, 'error');
    btn.classList.remove('playing');
    btn.innerHTML = '🔊 播放语音';
  });
}

function setStatus(msg, cls) {
  var bar = document.getElementById('status-bar');
  bar.textContent = msg || '';
  bar.className = 'status-bar' + (cls ? ' ' + cls : '');
}

// =========================================================================
// Enter to send
// =========================================================================
document.getElementById('text-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// =========================================================================
// Init
// =========================================================================
setStatus('', '');
</script>
</body>
</html>
